<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- FluxDeck: sun rising over a slider track.
       Mark = full sun + slider bar + accent fill + knob dot.
       Flat, two-tone: accent #4A6FD4, ink #E8EAF2. Dark-tray safe. -->
  <!-- sun -->
  <circle cx="64" cy="44" r="24" fill="#E8EAF2"/>
  <!-- rays -->
  <g stroke="#E8EAF2" stroke-width="6" stroke-linecap="round">
    <line x1="64" y1="8"  x2="64" y2="16"/>
    <line x1="96" y1="12" x2="90" y2="20"/>
    <line x1="32" y1="12" x2="38" y2="20"/>
    <line x1="104" y1="44" x2="96" y2="44"/>
    <line x1="32"  y1="44" x2="24" y2="44"/>
  </g>
  <!-- slider track + fill + knob -->
  <rect x="14" y="88" width="100" height="14" rx="7" fill="#3A3D47"/>
  <rect x="14" y="88" width="58"  height="14" rx="7" fill="#4A6FD4"/>
  <circle cx="72" cy="95" r="11" fill="#FFFFFF" stroke="#4A6FD4" stroke-width="4"/>
</svg>
